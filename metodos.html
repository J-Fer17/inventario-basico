<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métodos</title>
</head>
<body>

    <input type="number" id="numero">
    <button type="button" id="btnCalcular">Calcular</button>

    <p id="resultado"></p>

    <script>

        function Primo(n) {
            if (n < 2) return false;
            for (let i = 2; i < n; i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

        document.getElementById("btnCalcular").addEventListener("click", function() {
            const n = parseInt(document.getElementById("numero").value);

            const paridad = (n % 2 === 0) ? "par" : "impar";
            const primo   = Primo(n) ? "y primo" : "y no primo";

            document.getElementById("resultado").textContent = 
                "El número " + n + " es " + paridad + " " + primo;
        });

    </script>

</body>
</html>
