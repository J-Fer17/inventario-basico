<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Fer</title>
</head>
<body class="p-6 bg-base-200">
    <h1 class="text-3xl font-bold mb-4">Lista de productos</h1>
     <select id="filtro" class="select mb-4">
     <option value="todas">Todas las categorías</option>
     </select>
    <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
        <table class="table">
            <thead>
                <tr style="background-color:#534AB7;">
                    <th class="text-[#EEEDFE]">ID</th>
                    <th class="text-[#EEEDFE]">Nombre</th>
                    <th class="text-[#EEEDFE]">Precio</th>
                    <th class="text-[#EEEDFE]">Categoría</th>
                    <th class="text-[#EEEDFE]">Stock</th>
                    <th class="text-[#EEEDFE]">Total de Stock</th>  
                </tr>
            </thead>
            <tbody id="products"></tbody>
        </table>
    </div>

    <script src="productos.js"></script>
    <script src="productos_acciones.js"></script>
</body>
</html>
